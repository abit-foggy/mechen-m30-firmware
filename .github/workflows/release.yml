name: release

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: write   # create the release on the tag

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags + full history for version.py

      - name: Validate tag against VERSION
        run: |
          BASE=$(cat VERSION)
          TAG=${GITHUB_REF_NAME}
          if [ "$TAG" != "$BASE" ]; then
            echo "tag $TAG does not match VERSION $BASE (expected $BASE)" >&2
            exit 1
          fi
          echo "tag $TAG matches VERSION $BASE"

      - name: Download the official stock firmware
        run: curl --fail --location --retry 3 -o MECHEN_M30.HEX 'https://drive.google.com/uc?export=download&id=1lTyyP05toQHbcnmmiK3R9FFToj9RZfxC'

      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mips64-linux-gnuabi64 libc6-dev-i386 qemu-user-static
          git clone --depth 1 https://github.com/Rockbox/rockbox.git /tmp/rockbox
          make -C /tmp/rockbox/utils/atj2137/atjboottool

      - name: Build and test from the exact tag (channel release)
        env:
          CROSS: mips64-linux-gnuabi64-
          BUILD_CHANNEL: release
          ATJBOOTTOOL: /tmp/rockbox/utils/atj2137/atjboottool/atjboottool
        run: ./build.sh --test MECHEN_M30.HEX build

      - name: Verify the artifact
        run: |
          test -s build/MECHEN_M30.HEX
          /tmp/rockbox/utils/atj2137/atjboottool/atjboottool -c --fwu -o /tmp/verify_dec.bin build/MECHEN_M30.HEX
          cat build/version.json
          sha256sum build/MECHEN_M30.HEX

      - name: Publish verified image and commit list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          previous=$(git describe --tags --abbrev=0 --exclude=nightly HEAD^)
          cat "docs/releases/$GITHUB_REF_NAME.md" > "$RUNNER_TEMP/notes.md"
          printf '\n## Commits\n\n' >> "$RUNNER_TEMP/notes.md"
          git log --reverse --format='- %h %s' "$previous..HEAD" >> "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" build/MECHEN_M30.HEX --verify-tag \
            --title "$GITHUB_REF_NAME-release" --notes-file "$RUNNER_TEMP/notes.md"
