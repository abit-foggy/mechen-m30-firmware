# Nightly builds: rolling "nightly" release with a movable "nightly" tag.
#
# Runs on pushes to main and on manual dispatch. Builds with
# BUILD_CHANNEL=nightly (which requires a clean checkout) and, only after the
# build and its verification suite pass, replaces the artifact of the existing
# rolling release named "nightly" and moves the "nightly" tag to this commit.
# The full commit SHA goes into the release description; the short SHA is what
# the firmware's Information screen shows.
#
# Setup required once (see docs/versioning.md):
#   - secret STOCK_HEX_B64: base64 of the official 2025-06-26 MECHEN_M30.HEX
#     (build.sh refuses any other file by sha256, so a wrong secret fails safe)
#   - Actions permissions: contents: write (to move the nightly tag)
name: nightly

on:
  push:
    branches: [main]
    paths: [VERSION, build.sh, tools/**, patches/**, .github/workflows/nightly.yml]
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write   # move the movable "nightly" tag

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: version.py needs HEAD and tag state

      - name: Restore the stock firmware HEX from the secret
        run: printf '%s' "$STOCK_HEX_B64" | base64 -d > MECHEN_M30.HEX
        env:
          STOCK_HEX_B64: ${{ secrets.STOCK_HEX_B64 }}

      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mips64-linux-gnu qemu-user-static
          git clone --depth 1 https://github.com/Rockbox/rockbox.git /tmp/rockbox
          make -C /tmp/rockbox/utils/atj2137/atjboottool

      - name: Build and test (channel nightly)
        env:
          BUILD_CHANNEL: nightly
          ATJBOOTTOOL: /tmp/rockbox/utils/atj2137/atjboottool/atjboottool
        run: ./build.sh --test MECHEN_M30.HEX build

      - name: Verify the artifact
        run: |
          test -s build/MECHEN_M30.HEX
          /tmp/rockbox/utils/atj2137/atjboottool/atjboottool -c --fwu -o /tmp/verify_dec.bin build/MECHEN_M30.HEX
          cat build/version.json
          sha256sum build/MECHEN_M30.HEX

      # Only reached after a successful build + verify. The rolling release and
      # tag are updated in place; the stable v* tags are never touched.
      - name: Move the nightly tag and update the rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(git rev-parse HEAD)
          git tag -f nightly "$SHA"
          git push -f origin nightly
          NOTES="Nightly build of commit \`$SHA\`.

Built and fully tested by CI (\`./build.sh --test\`, channel \`nightly\`).
Short commit: \`${SHA:0:7}\` — shown on the device under Settings > Information.

Artifact: \`MECHEN_M30.HEX\` (standard firmware filename)."
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --title "nightly" --notes "$NOTES"
          else
            gh release create nightly --title "nightly" --notes "$NOTES" --prerelease
          fi
          gh release upload nightly build/MECHEN_M30.HEX --clobber
